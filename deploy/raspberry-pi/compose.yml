services:
  relais:
    image: ${RELAIS_IMAGE_REPOSITORY}:${RELAIS_VERSION}
    container_name: relais
    restart: unless-stopped

    environment:
      DEVICE_REGISTRATION_TOKEN: ${DEVICE_REGISTRATION_TOKEN}
      RELAIS_ADMIN_PASSWORD_HASH: ${RELAIS_ADMIN_PASSWORD_HASH}
      RELAIS_SESSION_SECURE: ${RELAIS_SESSION_SECURE:-false}
      RUST_LOG: ${RUST_LOG:-info}

    working_dir: /app

    ports:
      - "8080:8080"

    volumes:
      - /opt/relais/config.toml:/app/config.toml:ro
      - /opt/relais/data:/app/data

    devices:
      - ${GPS_DEVICE}:${GPS_DEVICE}

    group_add:
      - "${DIALOUT_GID:-20}"

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 20s