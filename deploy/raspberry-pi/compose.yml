services:
  gateway:
    image: ${GATEWAY_IMAGE_REPOSITORY}:${GATEWAY_VERSION}
    container_name: gateway
    restart: unless-stopped

    environment:
      DEVICE_REGISTRATION_TOKEN: ${DEVICE_REGISTRATION_TOKEN}
      GATEWAY_ADMIN_PASSWORD_HASH: ${GATEWAY_ADMIN_PASSWORD_HASH}
      GATEWAY_SESSION_SECURE: ${GATEWAY_SESSION_SECURE:-false}
      RUST_LOG: ${RUST_LOG:-info}

    working_dir: /app

    ports:
      - "8080:8080"

    volumes:
      - /opt/gateway/config.toml:/app/config.toml:ro
      - /opt/gateway/data:/app/data

    devices:
      - ${GPS_DEVICE}:${GPS_DEVICE}

    group_add:
      - "${DIALOUT_GID:-20}"

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 20s